services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-stock-analyst-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: ai-stock-analyst-postgres-setup
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_PROVIDER: postgres
      SQLITE_DB_PATH: /app/data/stock_analyst.db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "setup:postgres"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-stock-analyst-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_PROVIDER: postgres
      SQLITE_DB_PATH: /app/data/stock_analyst.db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  analysis-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: ai-stock-analyst-analysis-worker
    env_file:
      - .env
    environment:
      DATABASE_PROVIDER: postgres
      SQLITE_DB_PATH: /app/data/stock_analyst.db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      ANALYSIS_WORKER_TIMEZONE: Europe/Warsaw
      ANALYSIS_WORKER_TIMES_PL: "16:35,18:45,22:15"
      ANALYSIS_WORKER_SEC_REFRESH_ENABLED: "1"
      ANALYSIS_WORKER_SEC_REFRESH_PL: "21:45"
      ANALYSIS_WORKER_SEC_REFRESH_LIMIT: "25"
      ANALYSIS_WORKER_MARKET_SENTIMENT_ENABLED: "1"
      ANALYSIS_WORKER_MARKET_SENTIMENT_CRON: "*/30 14-23 * * 1-5"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
    command: ["npm", "run", "worker:analysis"]
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
